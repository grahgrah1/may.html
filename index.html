<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eye in a Jar Experiment</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: radial-gradient(circle at center, #0d1118 0%, #05070b 60%, #020304 100%);
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    .title {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 10px rgba(255,255,255,0.15);
    }

    .hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.60);
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
      text-shadow: 0 0 8px rgba(255,255,255,0.1);
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
</head>

<body>

  <div class="title">👁️ EYE IN A JAR</div>
  <div class="hint">ลูกตาในโหลทดลอง • มองตามเมาส์ • รูม่านตาตอบสนอง</div>

  <script type="module">
    import * as THREE from "three";

    // ======================================================
    // SCENE
    // ======================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070b);
    scene.fog = new THREE.Fog(0x05070b, 12, 24);

    // ======================================================
    // CAMERA
    // ======================================================

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    camera.position.set(0, 0.8, 10);

    // ======================================================
    // RENDERER
    // ======================================================

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // ======================================================
    // LIGHTING
    // ======================================================

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.1);
    scene.add(ambientLight);

    const topLight = new THREE.DirectionalLight(0xffffff, 2.8);
    topLight.position.set(3, 7, 5);
    scene.add(topLight);

    const blueLight = new THREE.PointLight(0x66b7ff, 16, 30);
    blueLight.position.set(-4, 3, 6);
    scene.add(blueLight);

    const rimLight = new THREE.PointLight(0x89d4ff, 10, 25);
    rimLight.position.set(4, 2, -2);
    scene.add(rimLight);

    const jarGlow = new THREE.PointLight(0x48bfff, 4, 10);
    jarGlow.position.set(0, 0, 3);
    scene.add(jarGlow);

    // ======================================================
    // LAB BACKGROUND
    // ======================================================

    const backWall = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 18),
      new THREE.MeshStandardMaterial({
        color: 0x0b1017,
        roughness: 0.95,
        metalness: 0.05
      })
    );

    backWall.position.set(0, 1.5, -8);
    scene.add(backWall);

    const table = new THREE.Mesh(
      new THREE.BoxGeometry(16, 1.2, 6),
      new THREE.MeshStandardMaterial({
        color: 0x1a2029,
        roughness: 0.85,
        metalness: 0.1
      })
    );

    table.position.set(0, -4.2, 0);
    scene.add(table);

    const stand = new THREE.Mesh(
      new THREE.CylinderGeometry(2.4, 2.8, 0.65, 64),
      new THREE.MeshStandardMaterial({
        color: 0x2b3440,
        roughness: 0.55,
        metalness: 0.45
      })
    );

    stand.position.set(0, -2.55, 0);
    scene.add(stand);

    // ======================================================
    // JAR GROUP
    // ======================================================

    const jarGroup = new THREE.Group();
    scene.add(jarGroup);

    // ======================================================
    // JAR LID
    // ======================================================

    const lid = new THREE.Mesh(
      new THREE.CylinderGeometry(2.18, 2.22, 0.42, 64),
      new THREE.MeshStandardMaterial({
        color: 0x7f8792,
        roughness: 0.35,
        metalness: 0.75
      })
    );

    lid.position.set(0, 2.62, 0);
    jarGroup.add(lid);

    const lidRim = new THREE.Mesh(
      new THREE.TorusGeometry(2.02, 0.07, 24, 100),
      new THREE.MeshStandardMaterial({
        color: 0xb1b8c2,
        roughness: 0.3,
        metalness: 0.85
      })
    );

    lidRim.rotation.x = Math.PI / 2;
    lidRim.position.set(0, 2.39, 0);
    jarGroup.add(lidRim);

    // ======================================================
    // JAR GLASS
    // ======================================================

    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xdff8ff,
      roughness: 0.02,
      metalness: 0,
      transparent: true,
      opacity: 0.18,
      transmission: 1,
      ior: 1.45,
      thickness: 0.5,
      clearcoat: 1,
      clearcoatRoughness: 0
    });

    const jarBody = new THREE.Mesh(
      new THREE.CylinderGeometry(2.05, 2.18, 5.1, 96, 1, true),
      glassMaterial
    );

    jarBody.position.set(0, 0, 0);
    jarBody.renderOrder = 10;
    jarGroup.add(jarBody);

    const jarBottom = new THREE.Mesh(
      new THREE.CylinderGeometry(2.05, 2.05, 0.18, 96),
      new THREE.MeshPhysicalMaterial({
        color: 0xdff8ff,
        roughness: 0.03,
        transparent: true,
        opacity: 0.28,
        transmission: 1,
        thickness: 0.4,
        ior: 1.45
      })
    );

    jarBottom.position.set(0, -2.47, 0);
    jarBottom.renderOrder = 9;
    jarGroup.add(jarBottom);

    const jarTopRing = new THREE.Mesh(
      new THREE.TorusGeometry(2.07, 0.07, 24, 100),
      new THREE.MeshPhysicalMaterial({
        color: 0xe8fbff,
        roughness: 0.03,
        transparent: true,
        opacity: 0.32,
        transmission: 1,
        thickness: 0.3
      })
    );

    jarTopRing.rotation.x = Math.PI / 2;
    jarTopRing.position.set(0, 2.28, 0);
    jarTopRing.renderOrder = 11;
    jarGroup.add(jarTopRing);

    const jarBottomRing = new THREE.Mesh(
      new THREE.TorusGeometry(2.07, 0.08, 24, 100),
      new THREE.MeshPhysicalMaterial({
        color: 0xe8fbff,
        roughness: 0.03,
        transparent: true,
        opacity: 0.35,
        transmission: 1,
        thickness: 0.3
      })
    );

    jarBottomRing.rotation.x = Math.PI / 2;
    jarBottomRing.position.set(0, -2.38, 0);
    jarBottomRing.renderOrder = 11;
    jarGroup.add(jarBottomRing);

    // ======================================================
    // LIQUID
    // ======================================================

    const liquidGroup = new THREE.Group();
    jarGroup.add(liquidGroup);

    const liquid = new THREE.Mesh(
      new THREE.CylinderGeometry(1.9, 2.0, 3.55, 96),
      new THREE.MeshPhysicalMaterial({
        color: 0x47b8e8,
        roughness: 0.08,
        metalness: 0,
        transparent: true,
        opacity: 0.30,
        transmission: 0.4,
        clearcoat: 1,
        clearcoatRoughness: 0.02
      })
    );

    liquid.position.set(0, -0.55, 0);
    liquid.renderOrder = 5;
    liquidGroup.add(liquid);

    const liquidSurface = new THREE.Mesh(
      new THREE.CircleGeometry(1.92, 96),
      new THREE.MeshPhysicalMaterial({
        color: 0x89ecff,
        transparent: true,
        opacity: 0.26,
        side: THREE.DoubleSide
      })
    );

    liquidSurface.rotation.x = -Math.PI / 2;
    liquidSurface.position.set(0, 1.215, 0);
    liquidSurface.renderOrder = 6;
    liquidGroup.add(liquidSurface);

    // ======================================================
    // BUBBLES
    // ======================================================

    const bubbles = [];
    const bubbleGroup = new THREE.Group();
    jarGroup.add(bubbleGroup);

    for (let i = 0; i < 24; i++) {
      const bubble = new THREE.Mesh(
        new THREE.SphereGeometry(0.03 + Math.random() * 0.06, 18, 18),
        new THREE.MeshPhysicalMaterial({
          color: 0xdffcff,
          transparent: true,
          opacity: 0.35 + Math.random() * 0.25,
          roughness: 0.05,
          transmission: 1,
          thickness: 0.2
        })
      );

      bubble.position.set(
        (Math.random() - 0.5) * 2.5,
        -1.9 + Math.random() * 3.0,
        (Math.random() - 0.5) * 1.7
      );

      bubble.userData = {
        speed: 0.005 + Math.random() * 0.012,
        drift: 0.002 + Math.random() * 0.005,
        baseX: bubble.position.x,
        phase: Math.random() * Math.PI * 2
      };

      bubble.renderOrder = 7;
      bubbleGroup.add(bubble);
      bubbles.push(bubble);
    }

    // ======================================================
    // EYE CONTAINER
    // ======================================================

    const eyeContainer = new THREE.Group();
    eyeContainer.position.set(0, 0.05, 0.08);
    jarGroup.add(eyeContainer);

    const eyeGroup = new THREE.Group();
    eyeContainer.add(eyeGroup);

    // ======================================================
    // EYEBALL
    // ======================================================

    const eyeballGeometry = new THREE.SphereGeometry(1.12, 128, 128);

    const eyeballMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xf9f9f7,
      roughness: 0.14,
      metalness: 0,
      clearcoat: 1,
      clearcoatRoughness: 0.025
    });

    const eyeball = new THREE.Mesh(eyeballGeometry, eyeballMaterial);
    eyeball.scale.y = 0.92;
    eyeGroup.add(eyeball);

    // ======================================================
    // IRIS GROUP
    // ======================================================

    const irisGroup = new THREE.Group();
    eyeGroup.add(irisGroup);

    // ======================================================
    // IRIS
    // ======================================================

    const irisGeometry = new THREE.CircleGeometry(0.43, 128);

    const irisMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x168cff,
      roughness: 0.30,
      clearcoat: 0.8,
      clearcoatRoughness: 0.06
    });

    const iris = new THREE.Mesh(irisGeometry, irisMaterial);
    iris.position.z = 1.13;
    irisGroup.add(iris);

    const darkRingGeometry = new THREE.RingGeometry(0.39, 0.43, 128);

    const darkRingMaterial = new THREE.MeshBasicMaterial({
      color: 0x052d4d,
      side: THREE.DoubleSide
    });

    const darkRing = new THREE.Mesh(darkRingGeometry, darkRingMaterial);
    darkRing.position.z = 1.135;
    irisGroup.add(darkRing);

    const irisLightGeometry = new THREE.RingGeometry(0.20, 0.36, 128);

    const irisLightMaterial = new THREE.MeshBasicMaterial({
      color: 0x67c8ff,
      transparent: true,
      opacity: 0.35,
      side: THREE.DoubleSide
    });

    const irisLight = new THREE.Mesh(irisLightGeometry, irisLightMaterial);
    irisLight.position.z = 1.138;
    irisGroup.add(irisLight);

    // ======================================================
    // IRIS FIBERS
    // ======================================================

    const irisLinesGroup = new THREE.Group();
    irisLinesGroup.position.z = 1.142;
    irisGroup.add(irisLinesGroup);

    const irisLineCount = 80;

    for (let i = 0; i < irisLineCount; i++) {
      const angle = (i / irisLineCount) * Math.PI * 2;
      const innerRadius = 0.18;
      const outerRadius = 0.29 + Math.random() * 0.08;

      const points = [
        new THREE.Vector3(
          Math.cos(angle) * innerRadius,
          Math.sin(angle) * innerRadius,
          0
        ),
        new THREE.Vector3(
          Math.cos(angle) * outerRadius,
          Math.sin(angle) * outerRadius,
          0
        )
      ];

      const geometry = new THREE.BufferGeometry().setFromPoints(points);

      const material = new THREE.LineBasicMaterial({
        color: Math.random() > 0.55 ? 0x8bdcff : 0x075182,
        transparent: true,
        opacity: 0.45 + Math.random() * 0.3
      });

      const line = new THREE.Line(geometry, material);
      irisLinesGroup.add(line);
    }

    // ======================================================
    // PUPIL GROUP
    // ======================================================

    const pupilGroup = new THREE.Group();
    irisGroup.add(pupilGroup);

    const pupilGeometry = new THREE.CircleGeometry(0.175, 128);

    const pupilMaterial = new THREE.MeshBasicMaterial({
      color: 0x000000
    });

    const pupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
    pupil.position.z = 1.15;
    pupilGroup.add(pupil);

    // ======================================================
    // REFLECTIONS
    // ======================================================

    const reflection1 = new THREE.Mesh(
      new THREE.CircleGeometry(0.08, 32),
      new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.95
      })
    );

    reflection1.position.set(0.12, 0.13, 1.16);
    irisGroup.add(reflection1);

    const reflection2 = new THREE.Mesh(
      new THREE.CircleGeometry(0.03, 32),
      new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.68
      })
    );

    reflection2.position.set(-0.08, -0.05, 1.161);
    irisGroup.add(reflection2);

    // ======================================================
    // POINTER
    // ======================================================

    let mouseX = 0;
    let mouseY = 0;

    let pointerX = window.innerWidth / 2;
    let pointerY = window.innerHeight / 2;

    function updatePointer(x, y) {
      pointerX = x;
      pointerY = y;

      mouseX = ((x / window.innerWidth) - 0.5) * 2;
      mouseY = -(((y / window.innerHeight) - 0.5) * 2);
    }

    window.addEventListener("mousemove", (event) => {
      updatePointer(event.clientX, event.clientY);
    });

    window.addEventListener("touchmove", (event) => {
      if (event.touches.length === 0) return;
      updatePointer(event.touches[0].clientX, event.touches[0].clientY);
    }, { passive: true });

    // ======================================================
    // RANDOM FUNCTION
    // ======================================================

    function randomRange(min, max) {
      return min + Math.random() * (max - min);
    }

    // ======================================================
    // SACCADE
    // ======================================================

    let saccadeX = 0;
    let saccadeY = 0;

    let targetSaccadeX = 0;
    let targetSaccadeY = 0;

    let nextSaccadeTime = performance.now() + randomRange(700, 2100);
    let saccadeReturnTime = 0;

    function triggerSaccade(now) {
      targetSaccadeX = randomRange(-0.10, 0.10);
      targetSaccadeY = randomRange(-0.06, 0.06);

      saccadeReturnTime = now + randomRange(90, 190);

      nextSaccadeTime = now + randomRange(900, 2900);
    }

    // ======================================================
    // PUPIL SETTINGS
    // ======================================================

    const pupilMinimumSize = 0.65;
    const pupilMaximumSize = 1.45;
    let pupilCurrentSize = 1;

    function updatePupil() {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      const dx = pointerX - centerX;
      const dy = pointerY - centerY;

      const distance = Math.sqrt(dx * dx + dy * dy);

      const maxDistance = Math.min(window.innerWidth, window.innerHeight) * 0.52;

      const normalized = THREE.MathUtils.clamp(distance / maxDistance, 0, 1);
      const proximity = 1 - normalized;
      const response = proximity * proximity;

      const targetSize = THREE.MathUtils.lerp(
        pupilMinimumSize,
        pupilMaximumSize,
        response
      );

      pupilCurrentSize += (targetSize - pupilCurrentSize) * 0.05;

      pupilGroup.scale.set(
        pupilCurrentSize,
        pupilCurrentSize,
        1
      );
    }

    // ======================================================
    // ANIMATION
    // ======================================================

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const time = now * 0.001;

      // ====================================================
      // SACCADE TIMER
      // ====================================================

      if (now >= nextSaccadeTime) {
        triggerSaccade(now);
      }

      if (saccadeReturnTime !== 0 && now >= saccadeReturnTime) {
        targetSaccadeX = 0;
        targetSaccadeY = 0;
        saccadeReturnTime = 0;
      }

      saccadeX += (targetSaccadeX - saccadeX) * 0.38;
      saccadeY += (targetSaccadeY - saccadeY) * 0.38;

      // ====================================================
      // EYE FOLLOW
      // ====================================================

      const targetRotationY = mouseX * 0.32 + saccadeX;
      const targetRotationX = -mouseY * 0.20 + saccadeY;

      eyeGroup.rotation.y += (targetRotationY - eyeGroup.rotation.y) * 0.065;
      eyeGroup.rotation.x += (targetRotationX - eyeGroup.rotation.x) * 0.065;

      irisGroup.position.x += (
        mouseX * 0.06 +
        saccadeX * 0.14 -
        irisGroup.position.x
      ) * 0.09;

      irisGroup.position.y += (
        mouseY * 0.045 -
        saccadeY * 0.11 -
        irisGroup.position.y
      ) * 0.09;

      // ====================================================
      // PUPIL
      // ====================================================

      updatePupil();

      // ====================================================
      // FLOATING EYE IN LIQUID
      // ====================================================

      eyeContainer.position.y = 0.06 + Math.sin(time * 1.3) * 0.12;
      eyeContainer.position.x = Math.sin(time * 0.7) * 0.04;
      eyeContainer.rotation.z = Math.sin(time * 1.1) * 0.04;
      eyeContainer.rotation.y += (Math.sin(time * 0.9) * 0.06 - eyeContainer.rotation.y) * 0.03;

      // ====================================================
      // JAR / LIQUID SUBTLE MOTION
      // ====================================================

      liquidSurface.position.y = 1.215 + Math.sin(time * 1.3) * 0.02;
      liquidSurface.rotation.z = Math.sin(time * 0.9) * 0.02;
      liquid.scale.x = 1 + Math.sin(time * 1.1) * 0.005;
      liquid.scale.z = 1 - Math.sin(time * 1.1) * 0.005;

      // ====================================================
      // BUBBLES
      // ====================================================

      for (const bubble of bubbles) {
        bubble.position.y += bubble.userData.speed;
        bubble.position.x = bubble.userData.baseX + Math.sin(time * 2 + bubble.userData.phase) * bubble.userData.drift * 20;

        if (bubble.position.y > 1.15) {
          bubble.position.y = -2.0 + Math.random() * 0.3;
          bubble.position.x = (Math.random() - 0.5) * 2.5;
          bubble.position.z = (Math.random() - 0.5) * 1.7;
          bubble.userData.baseX = bubble.position.x;
        }
      }

      // ====================================================
      // MICRO MOTION
      // ====================================================

      irisLinesGroup.rotation.z = Math.sin(time * 0.28) * 0.012;
      jarGroup.position.y = Math.sin(time * 0.55) * 0.015;

      // ====================================================
      // RENDER
      // ====================================================

      renderer.render(scene, camera);
    }

    animate();

    // ======================================================
    // RESIZE
    // ======================================================

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });
  </script>

</body>
</html>
