<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>3D Eyeball</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #050505;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    .title {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 24px;
      font-weight: bold;
      z-index: 10;
      pointer-events: none;
    }

    .hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.65);
      font-size: 13px;
      z-index: 10;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
</head>

<body>

  <div class="title">👁️ 3D EYEBALL</div>

  <div class="hint">
    มองตามเมาส์ • ตาดำหดขยาย • กระพริบอัตโนมัติ
  </div>

  <script type="module">

    import * as THREE from "three";


    // =====================================================
    // SCENE
    // =====================================================

    const scene = new THREE.Scene();

    scene.background =
      new THREE.Color(0x050505);


    // =====================================================
    // CAMERA
    // =====================================================

    const camera =
      new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );

    camera.position.set(
      0,
      0,
      6
    );


    // =====================================================
    // RENDERER
    // =====================================================

    const renderer =
      new THREE.WebGLRenderer({
        antialias: true
      });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );

    renderer.outputColorSpace =
      THREE.SRGBColorSpace;

    document.body.appendChild(
      renderer.domElement
    );


    // =====================================================
    // LIGHT
    // =====================================================

    const ambientLight =
      new THREE.AmbientLight(
        0xffffff,
        1.8
      );

    scene.add(
      ambientLight
    );


    const mainLight =
      new THREE.DirectionalLight(
        0xffffff,
        5
      );

    mainLight.position.set(
      5,
      5,
      6
    );

    scene.add(
      mainLight
    );


    const fillLight =
      new THREE.DirectionalLight(
        0x77aaff,
        1.8
      );

    fillLight.position.set(
      -5,
      2,
      4
    );

    scene.add(
      fillLight
    );


    // =====================================================
    // MAIN EYE GROUP
    // =====================================================

    const eyeContainer =
      new THREE.Group();

    scene.add(
      eyeContainer
    );


    const eyeGroup =
      new THREE.Group();

    eyeContainer.add(
      eyeGroup
    );


    // =====================================================
    // EYEBALL
    // =====================================================

    const eyeballGeometry =
      new THREE.SphereGeometry(
        1.55,
        128,
        128
      );


    const eyeballMaterial =
      new THREE.MeshPhysicalMaterial({

        color: 0xfafafa,

        roughness: 0.18,

        metalness: 0,

        clearcoat: 1,

        clearcoatRoughness: 0.03

      });


    const eyeball =
      new THREE.Mesh(
        eyeballGeometry,
        eyeballMaterial
      );


    eyeball.scale.y =
      0.92;


    eyeGroup.add(
      eyeball
    );


    // =====================================================
    // IRIS GROUP
    // =====================================================

    const irisGroup =
      new THREE.Group();

    eyeGroup.add(
      irisGroup
    );


    // =====================================================
    // IRIS
    // =====================================================

    const irisGeometry =
      new THREE.CircleGeometry(
        0.58,
        128
      );


    const irisMaterial =
      new THREE.MeshPhysicalMaterial({

        color: 0x168cff,

        roughness: 0.3,

        clearcoat: 0.9

      });


    const iris =
      new THREE.Mesh(
        irisGeometry,
        irisMaterial
      );


    iris.position.z =
      1.57;


    irisGroup.add(
      iris
    );


    // =====================================================
    // IRIS RING
    // =====================================================

    const ringGeometry =
      new THREE.RingGeometry(
        0.27,
        0.53,
        128
      );


    const ringMaterial =
      new THREE.MeshBasicMaterial({

        color: 0x61c3ff,

        transparent: true,

        opacity: 0.45,

        side: THREE.DoubleSide

      });


    const ring =
      new THREE.Mesh(
        ringGeometry,
        ringMaterial
      );


    ring.position.z =
      1.575;


    irisGroup.add(
      ring
    );


    // =====================================================
    // PUPIL GROUP
    // =====================================================

    const pupilGroup =
      new THREE.Group();

    irisGroup.add(
      pupilGroup
    );


    // =====================================================
    // PUPIL
    // =====================================================

    const pupilGeometry =
      new THREE.CircleGeometry(
        0.24,
        128
      );


    const pupilMaterial =
      new THREE.MeshBasicMaterial({
        color: 0x000000
      });


    const pupil =
      new THREE.Mesh(
        pupilGeometry,
        pupilMaterial
      );


    pupil.position.z =
      1.59;


    pupilGroup.add(
      pupil
    );


    // =====================================================
    // REFLECTION 1
    // =====================================================

    const reflection1Geometry =
      new THREE.CircleGeometry(
        0.10,
        32
      );


    const reflection1Material =
      new THREE.MeshBasicMaterial({

        color: 0xffffff,

        transparent: true,

        opacity: 0.95

      });


    const reflection1 =
      new THREE.Mesh(
        reflection1Geometry,
        reflection1Material
      );


    reflection1.position.set(
      0.18,
      0.18,
      1.605
    );


    irisGroup.add(
      reflection1
    );


    // =====================================================
    // REFLECTION 2
    // =====================================================

    const reflection2Geometry =
      new THREE.CircleGeometry(
        0.045,
        32
      );


    const reflection2Material =
      new THREE.MeshBasicMaterial({

        color: 0xffffff,

        transparent: true,

        opacity: 0.7

      });


    const reflection2 =
      new THREE.Mesh(
        reflection2Geometry,
        reflection2Material
      );


    reflection2.position.set(
      -0.10,
      -0.08,
      1.605
    );


    irisGroup.add(
      reflection2
    );


    // =====================================================
    // BLINK MASK GROUP
    // =====================================================

    const blinkGroup =
      new THREE.Group();

    scene.add(
      blinkGroup
    );


    const blinkMaterial =
      new THREE.MeshBasicMaterial({

        color: 0x050505,

        side: THREE.DoubleSide

      });


    // =====================================================
    // TOP BLINK MASK
    // =====================================================

    const topMaskGeometry =
      new THREE.PlaneGeometry(
        5,
        2.2
      );


    const topMask =
      new THREE.Mesh(
        topMaskGeometry,
        blinkMaterial
      );


    topMask.position.set(
      0,
      2.5,
      2
    );


    blinkGroup.add(
      topMask
    );


    // =====================================================
    // BOTTOM BLINK MASK
    // =====================================================

    const bottomMaskGeometry =
      new THREE.PlaneGeometry(
        5,
        2.2
      );


    const bottomMask =
      new THREE.Mesh(
        bottomMaskGeometry,
        blinkMaterial
      );


    bottomMask.position.set(
      0,
      -2.5,
      2
    );


    blinkGroup.add(
      bottomMask
    );


    // =====================================================
    // MOUSE
    // =====================================================

    let mouseX = 0;

    let mouseY = 0;


    window.addEventListener(
      "mousemove",
      (event) => {

        mouseX =
          (
            event.clientX /
            window.innerWidth
            -
            0.5
          ) * 2;


        mouseY =
          -(
            event.clientY /
            window.innerHeight
            -
            0.5
          ) * 2;

      }
    );


    // =====================================================
    // TOUCH
    // =====================================================

    window.addEventListener(
      "touchmove",
      (event) => {

        const touch =
          event.touches[0];


        mouseX =
          (
            touch.clientX /
            window.innerWidth
            -
            0.5
          ) * 2;


        mouseY =
          -(
            touch.clientY /
            window.innerHeight
            -
            0.5
          ) * 2;

      },

      {
        passive: true
      }
    );


    // =====================================================
    // PUPIL DILATION SETTINGS
    // =====================================================

    const pupilMinimumSize =
      0.55;


    const pupilMaximumSize =
      1.35;


    const pupilSpeed =
      1.2;


    // =====================================================
    // BLINK SETTINGS
    // =====================================================

    let blinkStart =
      performance.now();


    let nextBlink =
      2500;


    const blinkDuration =
      230;


    // =====================================================
    // BLINK FUNCTION
    // =====================================================

    function updateBlink(now) {

      const elapsed =
        now - blinkStart;


      if (elapsed > nextBlink) {

        blinkStart =
          now;


        nextBlink =
          2500 +
          Math.random() * 3500;

      }


      const blinkTime =
        now - blinkStart;


      let blinkAmount =
        0;


      if (
        blinkTime <
        blinkDuration
      ) {

        const progress =
          blinkTime /
          blinkDuration;


        // ปิดช่วงครึ่งแรก
        // เปิดช่วงครึ่งหลัง

        blinkAmount =
          Math.sin(
            progress *
            Math.PI
          );

      }


      // 0 = เปิดเต็ม
      // 1 = ปิดเต็ม

      const closeDistance =
        1.47;


      topMask.position.y =
        2.5 -
        (
          blinkAmount *
          closeDistance
        );


      bottomMask.position.y =
        -2.5 +
        (
          blinkAmount *
          closeDistance
        );

    }


    // =====================================================
    // DOUBLE BLINK RANDOM
    // =====================================================

    let lastDoubleBlink =
      0;


    function randomDoubleBlink(now) {

      if (
        now -
        lastDoubleBlink >
        10000
      ) {

        if (
          Math.random() <
          0.003
        ) {

          blinkStart =
            now;

          nextBlink =
            450;

          lastDoubleBlink =
            now;

        }

      }

    }


    // =====================================================
    // ANIMATION
    // =====================================================

    function animate() {

      requestAnimationFrame(
        animate
      );


      const now =
        performance.now();


      const time =
        now * 0.001;


      // =================================================
      // LEFT / RIGHT
      // =================================================

      eyeGroup.rotation.y +=

        (
          mouseX * 0.38
          -
          eyeGroup.rotation.y
        )

        * 0.06;


      // =================================================
      // UP / DOWN
      // =================================================

      eyeGroup.rotation.x +=

        (
          -mouseY * 0.24
          -
          eyeGroup.rotation.x
        )

        * 0.06;


      // =================================================
      // IRIS FOLLOW
      // =================================================

      irisGroup.position.x +=

        (
          mouseX * 0.10
          -
          irisGroup.position.x
        )

        * 0.08;


      irisGroup.position.y +=

        (
          mouseY * 0.07
          -
          irisGroup.position.y
        )

        * 0.08;


      // =================================================
      // PUPIL DILATION
      // =================================================

      const pupilWave =

        (
          Math.sin(
            time *
            pupilSpeed
          )
          +
          1
        )

        / 2;


      const pupilSize =

        THREE.MathUtils.lerp(

          pupilMinimumSize,

          pupilMaximumSize,

          pupilWave

        );


      pupilGroup.scale.set(

        pupilSize,

        pupilSize,

        1

      );


      // =================================================
      // FLOATING
      // =================================================

      eyeContainer.position.y =

        Math.sin(
          time * 1.1
        )

        * 0.04;


      // =================================================
      // BLINK
      // =================================================

      updateBlink(
        now
      );


      randomDoubleBlink(
        now
      );


      // =================================================
      // RENDER
      // =================================================

      renderer.render(
        scene,
        camera
      );

    }


    animate();


    // =====================================================
    // RESIZE
    // =====================================================

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
