<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cloud Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        Arial,
        sans-serif;

      color: white;

      background:
        radial-gradient(
          circle at top,
          #202d40 0%,
          #0d1117 45%,
          #05070a 100%
        );
    }

    button,
    input {
      font: inherit;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        18px
        5%;

      background:
        rgba(
          5,
          7,
          10,
          0.72
        );

      backdrop-filter:
        blur(18px);

      border-bottom:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.08
        );
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      background:
        rgba(
          255,
          255,
          255,
          0.09
        );

      font-size: 22px;
    }

    .brand strong {
      display: block;
      font-size: 18px;
    }

    .brand small {
      color:
        rgba(
          255,
          255,
          255,
          0.5
        );
    }

    .owner-button {
      border: 1px
        solid
        rgba(
          255,
          255,
          255,
          0.13
        );

      border-radius: 12px;

      padding:
        10px
        15px;

      color: white;

      background:
        rgba(
          255,
          255,
          255,
          0.07
        );

      cursor: pointer;
    }

    main {
      width:
        min(
          1200px,
          92%
        );

      margin:
        0
        auto;

      padding:
        55px
        0
        80px;
    }

    .hero {
      text-align: center;

      margin-bottom:
        40px;
    }

    .hero h1 {
      margin:
        0
        0
        15px;

      font-size:
        clamp(
          36px,
          7vw,
          68px
        );

      letter-spacing:
        -2px;
    }

    .hero p {
      max-width:
        650px;

      margin:
        auto;

      line-height:
        1.7;

      color:
        rgba(
          255,
          255,
          255,
          0.58
        );
    }

    /* ================================
       OWNER PANEL
    ================================ */

    .owner-panel {
      display: none;

      max-width:
        480px;

      margin:
        0
        auto
        35px;

      padding:
        24px;

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.10
        );

      border-radius:
        22px;

      background:
        rgba(
          255,
          255,
          255,
          0.05
        );
    }

    .owner-panel.open {
      display: block;
    }

    .owner-panel h3 {
      margin-top: 0;
    }

    .owner-panel input {
      width: 100%;

      margin-bottom:
        12px;

      padding:
        13px
        14px;

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.12
        );

      border-radius:
        12px;

      outline: none;

      background:
        rgba(
          255,
          255,
          255,
          0.07
        );

      color: white;
    }

    .owner-panel input:focus {
      border-color:
        rgba(
          255,
          255,
          255,
          0.5
        );
    }

    .login-button {
      width: 100%;

      border: 0;

      padding:
        13px;

      border-radius:
        12px;

      background:
        white;

      color:
        #080b10;

      font-weight:
        bold;

      cursor: pointer;
    }

    .owner-status {
      margin-top:
        12px;

      min-height:
        20px;

      text-align: center;

      font-size:
        13px;

      color:
        rgba(
          255,
          255,
          255,
          0.65
        );
    }

    /* ================================
       OWNER LOGGED
    ================================ */

    .owner-logged {
      display: none;

      align-items: center;
      justify-content: space-between;

      gap: 12px;

      margin-bottom:
        28px;

      padding:
        14px
        17px;

      border-radius:
        15px;

      background:
        rgba(
          70,
          200,
          130,
          0.10
        );

      border:
        1px
        solid
        rgba(
          70,
          200,
          130,
          0.18
        );
    }

    .owner-logged.show {
      display: flex;
    }

    .logout-button {
      border: 0;

      border-radius:
        10px;

      padding:
        9px
        13px;

      cursor: pointer;

      background:
        rgba(
          255,
          255,
          255,
          0.12
        );

      color: white;
    }

    /* ================================
       UPLOAD
    ================================ */

    .upload-section {
      display: none;
    }

    .upload-section.show {
      display: block;
    }

    .upload-box {
      min-height:
        220px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      padding: 30px;

      text-align: center;

      border:
        2px
        dashed
        rgba(
          255,
          255,
          255,
          0.18
        );

      border-radius:
        25px;

      background:
        rgba(
          255,
          255,
          255,
          0.04
        );

      cursor: pointer;

      transition:
        0.2s;
    }

    .upload-box:hover {
      background:
        rgba(
          255,
          255,
          255,
          0.07
        );

      border-color:
        rgba(
          255,
          255,
          255,
          0.4
        );
    }

    .upload-box.dragging {
      border-color:
        #7ec8ff;

      background:
        rgba(
          80,
          170,
          255,
          0.12
        );
    }

    .upload-icon {
      margin-bottom:
        10px;

      font-size:
        44px;
    }

    .upload-box h3 {
      margin:
        8px
        0;
    }

    .upload-box p {
      margin:
        0
        0
        18px;

      color:
        rgba(
          255,
          255,
          255,
          0.5
        );
    }

    .choose-button {
      border: 0;

      border-radius:
        12px;

      padding:
        12px
        19px;

      background:
        white;

      color:
        #080b10;

      font-weight:
        bold;

      cursor: pointer;
    }

    #fileInput {
      display: none;
    }

    .upload-progress {
      display: none;

      margin-top:
        15px;

      text-align: center;

      color:
        rgba(
          255,
          255,
          255,
          0.7
        );
    }

    .upload-progress.show {
      display: block;
    }

    /* ================================
       GALLERY
    ================================ */

    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin:
        50px
        0
        20px;
    }

    .gallery-header h2 {
      margin: 0;
    }

    .counter {
      padding:
        8px
        12px;

      border-radius:
        30px;

      background:
        rgba(
          255,
          255,
          255,
          0.07
        );

      color:
        rgba(
          255,
          255,
          255,
          0.7
        );

      font-size:
        13px;
    }

    .gallery {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(
            220px,
            1fr
          )
        );

      gap: 16px;
    }

    .photo {
      position: relative;

      overflow: hidden;

      border-radius:
        19px;

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.07
        );

      background:
        rgba(
          255,
          255,
          255,
          0.04
        );

      cursor: pointer;
    }

    .photo img {
      width: 100%;
      height: 260px;

      display: block;

      object-fit: cover;

      transition:
        transform
        0.3s;
    }

    .photo:hover img {
      transform:
        scale(1.04);
    }

    .photo-footer {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      display: flex;
      justify-content: flex-end;

      padding:
        35px
        10px
        10px;

      background:
        linear-gradient(
          transparent,
          rgba(
            0,
            0,
            0,
            0.8
          )
        );
    }

    .delete-button {
      display: none;

      width: 36px;
      height: 36px;

      border: 0;

      border-radius:
        10px;

      background:
        rgba(
          160,
          30,
          30,
          0.85
        );

      color: white;

      cursor: pointer;
    }

    body.owner-mode
    .delete-button {
      display: block;
    }

    .empty {
      padding:
        60px
        20px;

      text-align: center;

      color:
        rgba(
          255,
          255,
          255,
          0.42
        );

      border:
        1px
        solid
        rgba(
          255,
          255,
          255,
          0.07
        );

      border-radius:
        20px;
    }

    .loading {
      text-align: center;

      padding:
        50px;

      color:
        rgba(
          255,
          255,
          255,
          0.5
        );
    }

    /* ================================
       IMAGE VIEWER
    ================================ */

    .viewer {
      position: fixed;
      inset: 0;

      z-index: 1000;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 25px;

      background:
        rgba(
          0,
          0,
          0,
          0.9
        );

      backdrop-filter:
        blur(15px);
    }

    .viewer.open {
      display: flex;
    }

    .viewer img {
      max-width:
        95%;

      max-height:
        88vh;

      object-fit:
        contain;

      border-radius:
        14px;
    }

    .viewer-close {
      position: absolute;

      top: 22px;
      right: 25px;

      width: 45px;
      height: 45px;

      border: 0;

      border-radius:
        50%;

      background:
        rgba(
          255,
          255,
          255,
          0.12
        );

      color: white;

      font-size:
        23px;

      cursor: pointer;
    }

    @media (
      max-width: 600px
    ) {

      header {
        padding:
          14px
          16px;
      }

      .brand small {
        display: none;
      }

      main {
        width: 92%;

        padding-top:
          35px;
      }

      .hero h1 {
        letter-spacing:
          -1px;
      }

      .gallery {
        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );

        gap: 9px;
      }

      .photo img {
        height:
          190px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="brand">

    <div class="brand-icon">
      ☁️
    </div>

    <div>

      <strong>
        Cloud Gallery
      </strong>

      <small>
        รูปภาพออนไลน์
      </small>

    </div>

  </div>


  <button
    type="button"
    class="owner-button"
    id="ownerButton"
  >
    🔐 เจ้าของ
  </button>

</header>


<main>

  <section class="hero">

    <h1>
      คลังรูปภาพ
    </h1>

    <p>
      รูปทั้งหมดในหน้านี้ถูกบันทึกบน Cloud
      สามารถเปิดดูจากอุปกรณ์เครื่องอื่นได้
    </p>

  </section>


  <!-- LOGIN -->

  <section
    class="owner-panel"
    id="ownerPanel"
  >

    <h3>
      🔐 เข้าสู่ระบบเจ้าของ
    </h3>

    <input
      type="email"
      id="emailInput"
      placeholder="Email"
      autocomplete="username"
    >

    <input
      type="password"
      id="passwordInput"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      type="button"
      class="login-button"
      id="loginButton"
    >
      เข้าสู่ระบบ
    </button>

    <div
      class="owner-status"
      id="ownerStatus"
    ></div>

  </section>


  <!-- LOGGED -->

  <section
    class="owner-logged"
    id="ownerLogged"
  >

    <span>
      ✅ เข้าสู่ระบบเจ้าของแล้ว
    </span>

    <button
      type="button"
      class="logout-button"
      id="logoutButton"
    >
      ออกจากระบบ
    </button>

  </section>


  <!-- UPLOAD -->

  <section
    class="upload-section"
    id="uploadSection"
  >

    <div
      class="upload-box"
      id="uploadBox"
    >

      <div class="upload-icon">
        📤
      </div>

      <h3>
        อัปโหลดรูปขึ้น Cloud
      </h3>

      <p>
        เลือกหลายรูปพร้อมกันได้
      </p>

      <button
        type="button"
        class="choose-button"
        id="chooseButton"
      >
        เลือกรูปจากคอม
      </button>

      <input
        type="file"
        id="fileInput"
        accept="image/*"
        multiple
      >

    </div>


    <div
      class="upload-progress"
      id="uploadProgress"
    >
    </div>

  </section>


  <!-- GALLERY -->

  <section>

    <div class="gallery-header">

      <h2>
        รูปทั้งหมด
      </h2>

      <div
        class="counter"
        id="counter"
      >
        0 รูป
      </div>

    </div>


    <div
      class="loading"
      id="loading"
    >
      กำลังโหลดรูป...
    </div>


    <div
      class="gallery"
      id="gallery"
    ></div>


    <div
      class="empty"
      id="empty"
      style="display:none"
    >
      📷 ยังไม่มีรูปภาพ
    </div>

  </section>

</main>


<!-- IMAGE VIEWER -->

<div
  class="viewer"
  id="viewer"
>

  <button
    type="button"
    class="viewer-close"
    id="viewerClose"
  >
    ×
  </button>

  <img
    id="viewerImage"
    alt="รูปภาพ"
  >

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

  // ======================================================
  // ใส่ข้อมูล Supabase ของนายตรงนี้
  // ======================================================

  const SUPABASE_URL =
    "ใส่_PROJECT_URL_ตรงนี้";


  const SUPABASE_KEY =
    "ใส่_PUBLISHABLE_OR_ANON_KEY_ตรงนี้";


  const BUCKET_NAME =
    "gallery";


  // ======================================================
  // CREATE CLIENT
  // ======================================================

  const sb =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ======================================================
  // ELEMENTS
  // ======================================================

  const ownerButton =
    document.getElementById(
      "ownerButton"
    );


  const ownerPanel =
    document.getElementById(
      "ownerPanel"
    );


  const emailInput =
    document.getElementById(
      "emailInput"
    );


  const passwordInput =
    document.getElementById(
      "passwordInput"
    );


  const loginButton =
    document.getElementById(
      "loginButton"
    );


  const ownerStatus =
    document.getElementById(
      "ownerStatus"
    );


  const ownerLogged =
    document.getElementById(
      "ownerLogged"
    );


  const logoutButton =
    document.getElementById(
      "logoutButton"
    );


  const uploadSection =
    document.getElementById(
      "uploadSection"
    );


  const uploadBox =
    document.getElementById(
      "uploadBox"
    );


  const chooseButton =
    document.getElementById(
      "chooseButton"
    );


  const fileInput =
    document.getElementById(
      "fileInput"
    );


  const uploadProgress =
    document.getElementById(
      "uploadProgress"
    );


  const gallery =
    document.getElementById(
      "gallery"
    );


  const loading =
    document.getElementById(
      "loading"
    );


  const empty =
    document.getElementById(
      "empty"
    );


  const counter =
    document.getElementById(
      "counter"
    );


  const viewer =
    document.getElementById(
      "viewer"
    );


  const viewerImage =
    document.getElementById(
      "viewerImage"
    );


  const viewerClose =
    document.getElementById(
      "viewerClose"
    );


  // ======================================================
  // STATE
  // ======================================================

  let currentUser =
    null;


  let galleryFiles =
    [];


  // ======================================================
  // OWNER PANEL
  // ======================================================

  ownerButton.addEventListener(
    "click",
    () => {

      ownerPanel.classList.toggle(
        "open"
      );

    }
  );


  // ======================================================
  // LOGIN
  // ======================================================

  loginButton.addEventListener(
    "click",
    async () => {

      const email =
        emailInput.value.trim();


      const password =
        passwordInput.value;


      if (
        !email ||
        !password
      ) {

        ownerStatus.textContent =
          "กรอก Email และ Password";

        return;

      }


      loginButton.disabled =
        true;


      ownerStatus.textContent =
        "กำลังเข้าสู่ระบบ...";


      const {
        data,
        error
      } =
        await sb.auth
          .signInWithPassword({

            email,

            password

          });


      loginButton.disabled =
        false;


      if (error) {

        console.error(
          error
        );


        ownerStatus.textContent =
          "เข้าสู่ระบบไม่สำเร็จ";

        return;

      }


      currentUser =
        data.user;


      ownerStatus.textContent =
        "";


      passwordInput.value =
        "";


      updateOwnerUI();


      await loadGallery();

    }
  );


  // ======================================================
  // ENTER LOGIN
  // ======================================================

  passwordInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Enter"
      ) {

        loginButton.click();

      }

    }
  );


  // ======================================================
  // LOGOUT
  // ======================================================

  logoutButton.addEventListener(
    "click",
    async () => {

      await sb.auth.signOut();


      currentUser =
        null;


      updateOwnerUI();


      await loadGallery();

    }
  );


  // ======================================================
  // OWNER UI
  // ======================================================

  function updateOwnerUI() {

    const loggedIn =
      Boolean(
        currentUser
      );


    document.body.classList.toggle(
      "owner-mode",
      loggedIn
    );


    uploadSection.classList.toggle(
      "show",
      loggedIn
    );


    ownerLogged.classList.toggle(
      "show",
      loggedIn
    );


    if (loggedIn) {

      ownerPanel.classList.remove(
        "open"
      );


      ownerButton.textContent =
        "✅ เจ้าของ";

    }

    else {

      ownerButton.textContent =
        "🔐 เจ้าของ";

    }

  }


  // ======================================================
  // CHECK CURRENT LOGIN
  // ======================================================

  async function checkUser() {

    const {
      data
    } =
      await sb.auth.getUser();


    currentUser =
      data?.user ||
      null;


    updateOwnerUI();

  }


  // ======================================================
  // AUTH CHANGE
  // ======================================================

  sb.auth.onAuthStateChange(
    (
      event,
      session
    ) => {

      currentUser =
        session?.user ||
        null;


      updateOwnerUI();

    }
  );


  // ======================================================
  // CHOOSE FILE
  // ======================================================

  chooseButton.addEventListener(
    "click",
    event => {

      event.stopPropagation();


      fileInput.click();

    }
  );


  uploadBox.addEventListener(
    "click",
    () => {

      fileInput.click();

    }
  );


  fileInput.addEventListener(
    "change",
    async () => {

      await uploadFiles(
        fileInput.files
      );


      fileInput.value =
        "";

    }
  );


  // ======================================================
  // DRAG DROP
  // ======================================================

  uploadBox.addEventListener(
    "dragover",
    event => {

      event.preventDefault();


      uploadBox.classList.add(
        "dragging"
      );

    }
  );


  uploadBox.addEventListener(
    "dragleave",
    () => {

      uploadBox.classList.remove(
        "dragging"
      );

    }
  );


  uploadBox.addEventListener(
    "drop",
    async event => {

      event.preventDefault();


      uploadBox.classList.remove(
        "dragging"
      );


      await uploadFiles(
        event.dataTransfer.files
      );

    }
  );


  // ======================================================
  // SAFE EXTENSION
  // ======================================================

  function getExtension(
    file
  ) {

    const parts =
      file.name.split(
        "."
      );


    let extension =
      parts.length >
      1
      ?
      parts.pop()
      :
      "jpg";


    extension =
      extension
        .toLowerCase()
        .replace(
          /[^a-z0-9]/g,
          ""
        );


    if (!extension) {

      extension =
        "jpg";

    }


    return extension;

  }


  // ======================================================
  // UPLOAD
  // ======================================================

  async function uploadFiles(
    fileList
  ) {

    if (!currentUser) {

      alert(
        "ต้องเข้าสู่ระบบเจ้าของก่อน"
      );

      return;

    }


    const files =
      Array.from(
        fileList
      )
      .filter(
        file =>
          file.type.startsWith(
            "image/"
          )
      );


    if (
      files.length === 0
    ) {

      return;

    }


    uploadProgress.classList.add(
      "show"
    );


    let success =
      0;


    for (
      let i = 0;
      i < files.length;
      i++
    ) {

      const file =
        files[i];


      /*
        จำกัด 10 MB ต่อรูป
      */

      if (
        file.size >
        10 *
        1024 *
        1024
      ) {

        continue;

      }


      uploadProgress.textContent =
        `กำลังอัปโหลด ${i + 1}/${files.length}`;


      const extension =
        getExtension(
          file
        );


      const fileName =
        `${Date.now()}-${crypto.randomUUID()}.${extension}`;


      const {
        error
      } =
        await sb.storage
          .from(
            BUCKET_NAME
          )
          .upload(
            fileName,
            file,
            {

              cacheControl:
                "3600",

              upsert:
                false,

              contentType:
                file.type,

              metadata: {

                originalName:
                  file.name

              }

            }
          );


      if (error) {

        console.error(
          "Upload error:",
          error
        );

      }

      else {

        success++;

      }

    }


    uploadProgress.textContent =
      `อัปโหลดสำเร็จ ${success}/${files.length} รูป`;


    await loadGallery();


    setTimeout(
      () => {

        uploadProgress.classList.remove(
          "show"
        );

      },
      2500
    );

  }


  // ======================================================
  // LOAD CLOUD GALLERY
  // ======================================================

  async function loadGallery() {

    loading.style.display =
      "block";


    empty.style.display =
      "none";


    gallery.innerHTML =
      "";


    const {
      data,
      error
    } =
      await sb.storage
        .from(
          BUCKET_NAME
        )
        .list(
          "",
          {

            limit:
              100,

            offset:
              0,

            sortBy: {

              column:
                "name",

              order:
                "desc"

            }

          }
        );


    loading.style.display =
      "none";


    if (error) {

      console.error(
        error
      );


      empty.style.display =
        "block";


      empty.textContent =
        "โหลดรูปไม่สำเร็จ";

      return;

    }


    galleryFiles =
      (
        data ||
        []
      )
      .filter(
        file =>
          file.id !==
          null
      );


    counter.textContent =
      `${galleryFiles.length} รูป`;


    if (
      galleryFiles.length ===
      0
    ) {

      empty.style.display =
        "block";


      empty.textContent =
        "📷 ยังไม่มีรูปภาพ";

      return;

    }


    renderGallery();

  }


  // ======================================================
  // PUBLIC URL
  // ======================================================

  function getImageURL(
    path
  ) {

    const {
      data
    } =
      sb.storage
        .from(
          BUCKET_NAME
        )
        .getPublicUrl(
          path
        );


    return data.publicUrl;

  }


  // ======================================================
  // RENDER
  // ======================================================

  function renderGallery() {

    gallery.innerHTML =
      "";


    galleryFiles.forEach(
      file => {

        const card =
          document.createElement(
            "article"
          );


        card.className =
          "photo";


        const image =
          document.createElement(
            "img"
          );


        image.src =
          getImageURL(
            file.name
          );


        image.loading =
          "lazy";


        image.alt =
          file.metadata
            ?.originalName
          ||
          "รูปภาพ";


        const footer =
          document.createElement(
            "div"
          );


        footer.className =
          "photo-footer";


        const deleteButton =
          document.createElement(
            "button"
          );


        deleteButton.type =
          "button";


        deleteButton.className =
          "delete-button";


        deleteButton.textContent =
          "🗑️";


        deleteButton.addEventListener(
          "click",
          async event => {

            event.stopPropagation();


            await deleteImage(
              file.name
            );

          }
        );


        footer.appendChild(
          deleteButton
        );


        card.appendChild(
          image
        );


        card.appendChild(
          footer
        );


        card.addEventListener(
          "click",
          () => {

            openViewer(
              image.src
            );

          }
        );


        gallery.appendChild(
          card
        );

      }
    );

  }


  // ======================================================
  // DELETE CLOUD IMAGE
  // ======================================================

  async function deleteImage(
    path
  ) {

    if (!currentUser) {

      return;

    }


    const confirmed =
      confirm(
        "ลบรูปนี้ออกจาก Cloud จริงหรือไม่?"
      );


    if (!confirmed) {

      return;

    }


    const {
      error
    } =
      await sb.storage
        .from(
          BUCKET_NAME
        )
        .remove([
          path
        ]);


    if (error) {

      console.error(
        error
      );


      alert(
        "ลบรูปไม่สำเร็จ"
      );

      return;

    }


    await loadGallery();

  }


  // ======================================================
  // IMAGE VIEWER
  // ======================================================

  function openViewer(
    url
  ) {

    viewerImage.src =
      url;


    viewer.classList.add(
      "open"
    );

  }


  function closeViewer() {

    viewer.classList.remove(
      "open"
    );


    viewerImage.src =
      "";

  }


  viewerClose.addEventListener(
    "click",
    closeViewer
  );


  viewer.addEventListener(
    "click",
    event => {

      if (
        event.target ===
        viewer
      ) {

        closeViewer();

      }

    }
  );


  window.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Escape"
      ) {

        closeViewer();

      }

    }
  );


  // ======================================================
  // START
  // ======================================================

  async function start() {

    await checkUser();

    await loadGallery();

  }


  start();

</script>

</body>
