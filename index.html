<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Image Gallery</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;

      background:
        radial-gradient(circle at top, #202c3a 0%, #0d1117 45%, #05070a 100%);

      color: white;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      width: 100%;
      padding: 24px 5%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid rgba(255,255,255,0.08);

      background: rgba(5,7,10,0.65);

      backdrop-filter: blur(15px);

      position: sticky;
      top: 0;

      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background: rgba(255,255,255,0.10);

      font-size: 22px;
    }

    .logo-text h1 {
      font-size: 20px;
    }

    .logo-text p {
      margin-top: 3px;

      font-size: 12px;

      color: rgba(255,255,255,0.55);
    }

    .image-counter {
      padding: 9px 14px;

      border-radius: 30px;

      background: rgba(255,255,255,0.08);

      color: rgba(255,255,255,0.75);

      font-size: 13px;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: min(1200px, 92%);

      margin: 0 auto;

      padding: 55px 0 80px;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      text-align: center;

      margin-bottom: 45px;
    }

    .hero h2 {
      font-size: clamp(32px, 6vw, 64px);

      margin-bottom: 14px;

      letter-spacing: -2px;
    }

    .hero p {
      max-width: 650px;

      margin: auto;

      font-size: 15px;

      line-height: 1.7;

      color: rgba(255,255,255,0.6);
    }

    /* =========================
       UPLOAD BOX
    ========================= */

    .upload-box {
      width: 100%;

      min-height: 250px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-direction: column;

      padding: 30px;

      border: 2px dashed rgba(255,255,255,0.18);

      border-radius: 26px;

      background: rgba(255,255,255,0.04);

      transition: 0.25s;

      cursor: pointer;
    }

    .upload-box:hover {
      border-color: rgba(255,255,255,0.45);

      background: rgba(255,255,255,0.07);
    }

    .upload-box.dragging {
      transform: scale(1.01);

      background: rgba(100,180,255,0.12);

      border-color: #75c6ff;
    }

    .upload-icon {
      width: 72px;
      height: 72px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 18px;

      border-radius: 22px;

      background: rgba(255,255,255,0.09);

      font-size: 34px;
    }

    .upload-box h3 {
      font-size: 20px;

      margin-bottom: 8px;
    }

    .upload-box p {
      margin-bottom: 20px;

      font-size: 13px;

      color: rgba(255,255,255,0.55);
    }

    #fileInput {
      display: none;
    }

    .upload-button {
      padding: 12px 22px;

      border: 0;

      border-radius: 14px;

      background: white;

      color: #0a0c10;

      font-size: 14px;
      font-weight: bold;

      cursor: pointer;
    }

    /* =========================
       GALLERY HEADER
    ========================= */

    .gallery-header {
      margin-top: 55px;
      margin-bottom: 22px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .gallery-header h3 {
      font-size: 21px;
    }

    .gallery-header p {
      margin-top: 4px;

      font-size: 12px;

      color: rgba(255,255,255,0.5);
    }

    .clear-button {
      border: 1px solid rgba(255,255,255,0.12);

      background: rgba(255,255,255,0.06);

      color: rgba(255,255,255,0.75);

      padding: 10px 15px;

      border-radius: 12px;

      cursor: pointer;
    }

    /* =========================
       GALLERY
    ========================= */

    .gallery {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(220px, 1fr)
        );

      gap: 18px;
    }

    .image-card {
      position: relative;

      min-height: 220px;

      border-radius: 20px;

      overflow: hidden;

      background: rgba(255,255,255,0.06);

      border: 1px solid rgba(255,255,255,0.08);

      cursor: pointer;
    }

    .image-card img {
      width: 100%;
      height: 260px;

      display: block;

      object-fit: cover;

      transition: 0.3s;
    }

    .image-card:hover img {
      transform: scale(1.05);
    }

    .image-info {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      padding: 35px 14px 14px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      background:
        linear-gradient(
          transparent,
          rgba(0,0,0,0.88)
        );
    }

    .image-name {
      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;

      font-size: 12px;
    }

    .delete-button {
      width: 32px;
      height: 32px;

      flex-shrink: 0;

      border: 0;

      border-radius: 9px;

      background: rgba(255,255,255,0.15);

      color: white;

      cursor: pointer;
    }

    .delete-button:hover {
      background: #a63333;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      padding: 60px 20px;

      text-align: center;

      border-radius: 20px;

      border: 1px solid rgba(255,255,255,0.07);

      color: rgba(255,255,255,0.4);
    }

    .empty-icon {
      margin-bottom: 10px;

      font-size: 40px;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 30px;

      background: rgba(0,0,0,0.88);

      backdrop-filter: blur(15px);

      z-index: 1000;
    }

    .modal.open {
      display: flex;
    }

    .modal img {
      max-width: min(100%, 1100px);

      max-height: 85vh;

      object-fit: contain;

      border-radius: 16px;
    }

    .modal-close {
      position: absolute;

      top: 25px;
      right: 30px;

      width: 46px;
      height: 46px;

      border: none;

      border-radius: 50%;

      background: rgba(255,255,255,0.13);

      color: white;

      font-size: 23px;

      cursor: pointer;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      header {
        padding: 16px 18px;
      }

      .logo-text p {
        display: none;
      }

      main {
        width: 92%;

        padding-top: 35px;
      }

      .hero h2 {
        letter-spacing: -1px;
      }

      .upload-box {
        min-height: 220px;
      }

      .gallery {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );

        gap: 10px;
      }

      .image-card img {
        height: 190px;
      }

      .image-name {
        display: none;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">

    <div class="logo-icon">
      🖼️
    </div>

    <div class="logo-text">

      <h1>
        My Gallery
      </h1>

      <p>
        Personal image collection
      </p>

    </div>

  </div>


  <div
    class="image-counter"
    id="counter"
  >
    0 รูป
  </div>

</header>


<main>

  <section class="hero">

    <h2>
      คลังรูปภาพของฉัน
    </h2>

    <p>
      เลือกรูปภาพจากคอมพิวเตอร์เพื่อเพิ่มเข้ามาใน Gallery
      ระบบ Cloud สำหรับแชร์รูปให้คนอื่นจะเพิ่มในขั้นต่อไป
    </p>

  </section>


  <section>

    <div
      class="upload-box"
      id="uploadBox"
    >

      <div class="upload-icon">
        ☁️
      </div>

      <h3>
        เพิ่มรูปภาพ
      </h3>

      <p>
        ลากรูปมาวางตรงนี้ หรือกดเลือกจากคอม
      </p>

      <button
        class="upload-button"
        id="selectButton"
        type="button"
      >
        เลือกรูปจากคอม
      </button>

      <input
        type="file"
        id="fileInput"
        accept="image/*"
        multiple
      >

    </div>

  </section>


  <section>

    <div class="gallery-header">

      <div>

        <h3>
          รูปภาพ
        </h3>

        <p>
          กดที่รูปเพื่อดูภาพขนาดใหญ่
        </p>

      </div>


      <button
        class="clear-button"
        id="clearButton"
        type="button"
      >
        ล้างทั้งหมด
      </button>

    </div>


    <div
      class="gallery"
      id="gallery"
    ></div>


    <div
      class="empty"
      id="empty"
    >

      <div class="empty-icon">
        📷
      </div>

      ยังไม่มีรูปภาพ

    </div>

  </section>

</main>


<div
  class="modal"
  id="modal"
>

  <button
    class="modal-close"
    id="modalClose"
    type="button"
  >
    ×
  </button>

  <img
    id="modalImage"
    alt="ภาพขนาดใหญ่"
  >

</div>


<script>

  const fileInput =
    document.getElementById(
      "fileInput"
    );


  const uploadBox =
    document.getElementById(
      "uploadBox"
    );


  const selectButton =
    document.getElementById(
      "selectButton"
    );


  const gallery =
    document.getElementById(
      "gallery"
    );


  const empty =
    document.getElementById(
      "empty"
    );


  const counter =
    document.getElementById(
      "counter"
    );


  const clearButton =
    document.getElementById(
      "clearButton"
    );


  const modal =
    document.getElementById(
      "modal"
    );


  const modalImage =
    document.getElementById(
      "modalImage"
    );


  const modalClose =
    document.getElementById(
      "modalClose"
    );


  let images = [];


  // ===================================
  // OPEN FILE SELECTOR
  // ===================================

  selectButton.addEventListener(
    "click",
    (event) => {

      event.stopPropagation();

      fileInput.click();

    }
  );


  uploadBox.addEventListener(
    "click",
    () => {

      fileInput.click();

    }
  );


  // ===================================
  // FILE INPUT
  // ===================================

  fileInput.addEventListener(
    "change",
    () => {

      handleFiles(
        fileInput.files
      );

      fileInput.value = "";

    }
  );


  // ===================================
  // DRAG
  // ===================================

  uploadBox.addEventListener(
    "dragover",
    (event) => {

      event.preventDefault();

      uploadBox.classList.add(
        "dragging"
      );

    }
  );


  uploadBox.addEventListener(
    "dragleave",
    () => {

      uploadBox.classList.remove(
        "dragging"
      );

    }
  );


  uploadBox.addEventListener(
    "drop",
    (event) => {

      event.preventDefault();

      uploadBox.classList.remove(
        "dragging"
      );


      handleFiles(
        event.dataTransfer.files
      );

    }
  );


  // ===================================
  // HANDLE FILES
  // ===================================

  function handleFiles(
    fileList
  ) {

    const files =
      Array.from(
        fileList
      );


    files.forEach(
      file => {

        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          return;

        }


        const imageURL =
          URL.createObjectURL(
            file
          );


        images.push({

          id:
            crypto.randomUUID(),

          name:
            file.name,

          url:
            imageURL,

          file:
            file

        });

      }
    );


    renderGallery();

  }


  // ===================================
  // RENDER
  // ===================================

  function renderGallery() {

    gallery.innerHTML = "";


    counter.textContent =
      `${images.length} รูป`;


    if (
      images.length === 0
    ) {

      empty.style.display =
        "block";

      return;

    }


    empty.style.display =
      "none";


    images.forEach(
      image => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "image-card";


        const img =
          document.createElement(
            "img"
          );


        img.src =
          image.url;


        img.alt =
          image.name;


        const info =
          document.createElement(
            "div"
          );


        info.className =
          "image-info";


        const name =
          document.createElement(
            "div"
          );


        name.className =
          "image-name";


        name.textContent =
          image.name;


        const deleteButton =
          document.createElement(
            "button"
          );


        deleteButton.className =
          "delete-button";


        deleteButton.type =
          "button";


        deleteButton.textContent =
          "×";


        deleteButton.addEventListener(
          "click",
          event => {

            event.stopPropagation();

            removeImage(
              image.id
            );

          }
        );


        info.appendChild(
          name
        );


        info.appendChild(
          deleteButton
        );


        card.appendChild(
          img
        );


        card.appendChild(
          info
        );


        card.addEventListener(
          "click",
          () => {

            openImage(
              image.url
            );

          }
        );


        gallery.appendChild(
          card
        );

      }
    );

  }


  // ===================================
  // REMOVE IMAGE
  // ===================================

  function removeImage(
    id
  ) {

    const image =
      images.find(
        item =>
          item.id === id
      );


    if (image) {

      URL.revokeObjectURL(
        image.url
      );

    }


    images =
      images.filter(
        item =>
          item.id !== id
      );


    renderGallery();

  }


  // ===================================
  // CLEAR
  // ===================================

  clearButton.addEventListener(
    "click",
    () => {

      images.forEach(
        image => {

          URL.revokeObjectURL(
            image.url
          );

        }
      );


      images = [];


      renderGallery();

    }
  );


  // ===================================
  // MODAL
  // ===================================

  function openImage(
    url
  ) {

    modalImage.src =
      url;


    modal.classList.add(
      "open"
    );

  }


  function closeModal() {

    modal.classList.remove(
      "open"
    );


    modalImage.src =
      "";

  }


  modalClose.addEventListener(
    "click",
    closeModal
  );


  modal.addEventListener(
    "click",
    event => {

      if (
        event.target === modal
      ) {

        closeModal();

      }

    }
  );


  window.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape"
      ) {

        closeModal();

      }

    }
  );


  // ===================================
  // INITIAL
  // ===================================

  renderGallery();

</script>

</body>
</html>
