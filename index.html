irisLinesGroup.position.z =

irisGroup.add(

);


for (

  i < 80;
  i++
) {

  const angle =

    Math.PI *

  const innerRadius =
    0.18;

  const outerRadius =
    0.29 +
    Math.random() *
    0.08;


  const geometry =
    new THREE.BufferGeometry()
      .setFromPoints([

        new THREE.Vector3(
          Math.cos(angle) *
          innerRadius,
          Math.sin(angle) *
          innerRadius,
          0
        ),

        new THREE.Vector3(
          Math.cos(angle) *
          outerRadius,
          Math.sin(angle) *
          outerRadius,
          0
        )

      ]);


  const line =
    new THREE.Line(

      geometry,

      new THREE.LineBasicMaterial({
        color:
          Math.random() > 0.55
          ? 0x8bdcff

        transparent: true,

const whiskerMaterial =
  new THREE.LineBasicMaterial({
    color: 0xd8d8d8,
    transparent: true,
    opacity: 0.7
  });


function createWhisker(
  y,
  z,
  direction
) {

  const geometry =
    new THREE.BufferGeometry()
      .setFromPoints([

        new THREE.Vector3(
          0.30,
          y,
          z
        ),

        new THREE.Vector3(
          0.58,
          y + 0.02 * direction,
          z + 0.10 * direction
        )

      ]);


  return new THREE.Line(
    geometry,
    whiskerMaterial
  );

}


ratHeadPivot.add(
  createWhisker(
    0.02,
    0.05,
    1
  )
);

ratHeadPivot.add(
  createWhisker(

);

// ======================================================
// LEGS
// ======================================================

function createRatLeg(
  x,
  z
) {

  const leg =
    new THREE.Group();


  const upper =
    new THREE.Mesh(

      new THREE.CapsuleGeometry(
        0.03,
        0.18,
        4,
        8
      ),

      ratFurMaterial

    );


  upper.rotation.z =
    Math.PI / 2;

  upper.position.y =
    -0.10;


  const foot =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        0.035,
        12,
        12
      ),

      ratTailMaterial

    );


  foot.position.set(
    0.10,
    -0.16,
    0
  );


  leg.add(
    upper
  );

  leg.add(
    foot
  );


  leg.position.set(
    x,
    -0.18,
    z
  );


  return leg;

}


const frontLeftLeg =
  createRatLeg(
    0.28,
    0.15
  );

const frontRightLeg =
  createRatLeg(
    0.28,
    -0.15
  );

  createRatLeg(

  );

  -0.60,

);

ratGroup.add(
  tailGroup
);


const tailSegments =
  [];


for (
  let i = 0;
  i < 7;
  i++
) {

  const segment =
    new THREE.Mesh(

      new THREE.CapsuleGeometry(
        0.025 -
        i * 0.002,

  tailGroup.add(

// ======================================================
// POINTER
// ======================================================

let mouseX = 0;
let mouseY = 0;

let pointerX =
  window.innerWidth / 2;

let pointerY =
  window.innerHeight / 2;


function updatePointer(
  x,
  y
) {

  pointerX = x;
  pointerY = y;


  mouseX =
    (
      x /
      window.innerWidth -
      0.5
    ) * 2;


  mouseY =
    -(
      y /
      window.innerHeight -
      0.5
    ) * 2;

}


window.addEventListener(
  "mousemove",
  event => {

    updatePointer(
      event.clientX,
      event.clientY
    );

  }
);


// ======================================================
// TOUCH
// ======================================================

window.addEventListener(
  "touchmove",
  event => {

    if (
      event.touches.length === 0
    ) {
      return;
    }


    updatePointer(
      event.touches[0].clientX,
      event.touches[0].clientY
    );

  },
  {
    passive: true
  }
);


// ======================================================
// RANDOM
// ======================================================

function randomRange(
  min,
  max
) {

  return (
    min +
    Math.random() *
    (max - min)
  );

}


// ======================================================
// SACCADE
// ======================================================

let saccadeX = 0;
let saccadeY = 0;

let targetSaccadeX = 0;
let targetSaccadeY = 0;

let nextSaccadeTime =
  performance.now() +
  randomRange(
    700,
    2100
  );

let saccadeReturnTime =
  0;


function triggerSaccade(
  now
) {

  targetSaccadeX =
    randomRange(
      -0.10,
      0.10
    );


  targetSaccadeY =
    randomRange(
      -0.06,
      0.06
    );


  saccadeReturnTime =
    now +
    randomRange(
      90,
      190
    );


  nextSaccadeTime =
    now +
    randomRange(
      900,
      2900
    );

}


// ======================================================
// PUPIL
// ======================================================

const pupilMinimumSize =
  0.65;

const pupilMaximumSize =
  1.45;

let pupilCurrentSize =
  1;


function updatePupil() {

  const centerX =
    window.innerWidth / 2;

  const centerY =
    window.innerHeight / 2;


  const dx =
    pointerX -
    centerX;

  const dy =
    pointerY -
    centerY;


  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );


  const maxDistance =
    Math.min(
      window.innerWidth,
      window.innerHeight
    ) * 0.52;


  const normalized =
    THREE.MathUtils.clamp(
      distance /
      maxDistance,
      0,
      1
    );


  const proximity =
    1 -
    normalized;


  const targetSize =
    THREE.MathUtils.lerp(
      pupilMinimumSize,
      pupilMaximumSize,
      proximity *
      proximity
    );


  pupilCurrentSize +=
    (
      targetSize -
      pupilCurrentSize
    ) * 0.05;


  pupilGroup.scale.set(
    pupilCurrentSize,
    pupilCurrentSize,
    1
  );

}


// ======================================================
// RAT BEHAVIOR
//
// 0-5 sec  : วิ่ง
// 5-6 sec  : ชะลอ
// 6-8.5 sec: หยุดมองลูกตา
// 8.5-9.2 : หันกลับ
// 9.2+    : วิ่งต่อ
// ======================================================

const RAT_CYCLE =
  13.5;


const RAT_START_X =
  -8;


const RAT_STOP_X =
  -2.8;


const RAT_END_X =
  8;


function smoothStep(
  t
) {

  t =
    THREE.MathUtils.clamp(
      t,
      0,
      1
    );


  return (
    t *
    t *
    (
      3 -
      2 * t
    )
  );

}


// ======================================================
// ANIMATION
// ======================================================

function animate() {

  requestAnimationFrame(
    animate
  );


  const now =
    performance.now();


  const time =
    now * 0.001;


// ======================================================
// SACCADE
// ======================================================

  if (
    now >=
    nextSaccadeTime
  ) {

    triggerSaccade(
      now
    );

  }


  if (
    saccadeReturnTime !== 0 &&
    now >= saccadeReturnTime
  ) {

    targetSaccadeX =
      0;

    targetSaccadeY =
      0;

    saccadeReturnTime =
      0;

  }


  saccadeX +=
    (
      targetSaccadeX -
      saccadeX
    ) * 0.38;


  saccadeY +=
    (
      targetSaccadeY -
      saccadeY
    ) * 0.38;


// ======================================================
// EYE FOLLOW
// ======================================================

  const targetRotationY =
    mouseX * 0.32 +
    saccadeX;


  const targetRotationX =
    -mouseY * 0.20 +
    saccadeY;


  eyeGroup.rotation.y +=
    (
      targetRotationY -
      eyeGroup.rotation.y
    ) * 0.065;


  eyeGroup.rotation.x +=
    (
      targetRotationX -
      eyeGroup.rotation.x
    ) * 0.065;


// ======================================================
// IRIS FOLLOW
// ======================================================

  irisGroup.position.x +=
    (
      mouseX * 0.06 +
      saccadeX * 0.14 -
      irisGroup.position.x
    ) * 0.09;


  irisGroup.position.y +=
    (
      mouseY * 0.045 -
      saccadeY * 0.11 -
      irisGroup.position.y
    ) * 0.09;


// ======================================================
// PUPIL
// ======================================================

  updatePupil();


// ======================================================
// FLOATING EYE
// ======================================================

  eyeContainer.position.y =
    0.06 +
    Math.sin(
      time * 1.3
    ) * 0.12;


  eyeContainer.position.x =
    Math.sin(
      time * 0.7
    ) * 0.04;


  eyeContainer.rotation.z =
    Math.sin(
      time * 1.1
    ) * 0.04;


// ======================================================
// BUBBLES
// ======================================================

  for (
    const bubble
    of bubbles
  ) {

    bubble.position.y +=
      bubble.userData.speed;


    bubble.position.x =
      bubble.userData.baseX +
      Math.sin(
        time * 2 +
        bubble.userData.phase
      ) * 0.05;


    if (
      bubble.position.y >
      1.15
    ) {

      bubble.position.y =
        -2 +
        Math.random() *
        0.3;


      bubble.position.x =
        (
          Math.random() -
          0.5
        ) * 2.5;


      bubble.userData.baseX =
        bubble.position.x;

    }

  }


// ======================================================
// LIQUID
// ======================================================

  liquidSurface.position.y =
    1.215 +
    Math.sin(
      time * 1.3
    ) * 0.02;


// ======================================================
// IRIS MICRO
// ======================================================

  irisLinesGroup.rotation.z =
    Math.sin(
      time * 0.28
    ) * 0.012;


// ======================================================
// RAT BEHAVIOR
// ======================================================

  const cycleTime =
    time %
    RAT_CYCLE;


  let ratX =
    RAT_START_X;


  let runningAmount =
    1;


  let headTurn =
    0;


// ======================================================
// PHASE 1
// วิ่งเข้าหาโหล
// ======================================================

  if (
    cycleTime <
    5
  ) {

    const p =
      cycleTime /
      5;


    ratX =
      THREE.MathUtils.lerp(
        RAT_START_X,
        RAT_STOP_X,
        p
      );


    runningAmount =
      1;

  }


// ======================================================
// PHASE 2
// ชะลอและหยุด
// ======================================================

  else if (
    cycleTime <
    6
  ) {

    const p =
      smoothStep(
        cycleTime -
        5
      );


    ratX =
      THREE.MathUtils.lerp(
        RAT_STOP_X - 0.4,
        RAT_STOP_X,
        p
      );


    runningAmount =
      1 -
      p;

  }


// ======================================================
// PHASE 3
// หันหัวไปมองลูกตา
// ======================================================

  else if (
    cycleTime <
    6.8
  ) {

    ratX =
      RAT_STOP_X;


    runningAmount =
      0;


    const p =
      smoothStep(
        (
          cycleTime -
          6
        ) /
        0.8
      );


    /*
      หมุนหัวเข้าหาโหล
    */

    headTurn =
      p *
      -0.95;

  }


// ======================================================
// PHASE 4
// ยืนมองลูกตา
// ======================================================

  else if (
    cycleTime <
    8.5
  ) {

    ratX =
      RAT_STOP_X;


    runningAmount =
      0;


    headTurn =
      -0.95;


    /*
      ขยับหัวเล็กน้อย
      เหมือนกำลังสังเกต
    */

    ratHeadPivot.rotation.z =
      Math.sin(
        time * 2.8
      ) * 0.06;

  }


// ======================================================
// PHASE 5
// หันหัวกลับ
// ======================================================

  else if (
    cycleTime <
    9.2
  ) {

    ratX =
      RAT_STOP_X;


    runningAmount =
      0;


    const p =
      smoothStep(
        (
          cycleTime -
          8.5
        ) /
        0.7
      );


    headTurn =
      THREE.MathUtils.lerp(
        -0.95,
        0,
        p
      );

  }


// ======================================================
// PHASE 6
// วิ่งต่อไปทางขวา
// ======================================================

  else {

    const p =
      (
        cycleTime -
        9.2
      )
      /
      (
        RAT_CYCLE -
        9.2
      );


    ratX =
      THREE.MathUtils.lerp(
        RAT_STOP_X,
        RAT_END_X,
        p
      );


    runningAmount =
      smoothStep(
        Math.min(
          1,
          p * 4
        )
      );

  }


// ======================================================
// APPLY RAT POSITION
// ======================================================

  ratGroup.position.x =
    ratX;


  ratGroup.position.y =
    -3.33 +
    Math.abs(
      Math.sin(
        time * 11
      )
    ) *
    0.035 *
    runningAmount;


// ======================================================
// HEAD LOOK
// ======================================================

  ratHeadPivot.rotation.y +=
    (
      headTurn -
      ratHeadPivot.rotation.y
    ) * 0.14;


// ======================================================
// RESET HEAD Z WHEN NOT WATCHING
// ======================================================

  if (
    cycleTime <
    6.8 ||
    cycleTime >=
    8.5
  ) {

    ratHeadPivot.rotation.z +=
      (
        0 -
        ratHeadPivot.rotation.z
      ) * 0.12;

  }


// ======================================================
// RUNNING LEGS
// ======================================================

  const runSwing =
    Math.sin(
      time * 14
    ) *
    runningAmount;


  const runSwingOpp =
    Math.sin(
      time * 14 +
      Math.PI
    ) *
    runningAmount;


  frontLeftLeg.rotation.z =
    runSwing * 0.75;


  backRightLeg.rotation.z =
    runSwing * 0.75;


  frontRightLeg.rotation.z =
    runSwingOpp * 0.75;


  backLeftLeg.rotation.z =
    runSwingOpp * 0.75;


// ======================================================
// RAT BODY MOVEMENT
// ======================================================

  ratBody.rotation.z =
    Math.sin(
      time * 14
    ) *
    0.025 *
    runningAmount;


// ======================================================
// TAIL
// ======================================================

  for (
    let i = 0;
    i <
    tailSegments.length;
    i++
  ) {

    tailSegments[i].rotation.y =
      Math.sin(
        time * 7 -
        i * 0.55
      ) *
      (
        0.10 +
        0.14 *
        runningAmount
      );


    tailSegments[i].position.y =
      Math.sin(
        time * 7 -
        i * 0.4
      ) * 0.01;

  }


// ======================================================
// RAT NOSE MOVEMENT WHEN WATCHING
// ======================================================

  if (
    cycleTime >=
    6.8 &&
    cycleTime <
    8.5
  ) {

    ratNose.scale.setScalar(
      1 +
      Math.sin(
        time * 12
      ) * 0.06
    );

  }

  else {

    ratNose.scale.setScalar(
      1
    );

  }


// ======================================================
// RENDER
// ======================================================

  renderer.render(
    scene,
    camera
  );

}


animate();


// ======================================================
// RESIZE
// ======================================================

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
