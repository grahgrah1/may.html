<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Eye</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: radial-gradient(circle at center, #1f1f1f 0%, #090909 100%);
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    .title {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
      z-index: 10;
    }

    .hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="title">3D Eye</div>
  <div class="hint">ลากเมาส์เพื่อหมุนมุมมองได้</div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 4;
    controls.maxDistance = 10;

    // แสง
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.5);
    dirLight1.position.set(5, 5, 5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight2.position.set(-5, -2, 4);
    scene.add(dirLight2);

    // กลุ่มดวงตา
    const eyeGroup = new THREE.Group();
    scene.add(eyeGroup);

    // ลูกตาสีขาว
    const eyeballGeometry = new THREE.SphereGeometry(1.45, 64, 64);
    const eyeballMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      roughness: 0.25,
      metalness: 0.0,
      clearcoat: 1,
      clearcoatRoughness: 0.05
    });

    const eyeball = new THREE.Mesh(eyeballGeometry, eyeballMaterial);
    eyeball.scale.y = 0.82; // ทำให้ดูเป็นทรงตา
    eyeGroup.add(eyeball);

    // ม่านตา
    const irisGeometry = new THREE.CircleGeometry(0.48, 64);
    const irisMaterial = new THREE.MeshStandardMaterial({
      color: 0x4ea3ff,
      roughness: 0.5,
      metalness: 0.1
    });

    const iris = new THREE.Mesh(irisGeometry, irisMaterial);
    iris.position.z = 1.18;
    eyeGroup.add(iris);

    // รูม่านตา
    const pupilGeometry = new THREE.CircleGeometry(0.18, 64);
    const pupilMaterial = new THREE.MeshStandardMaterial({
      color: 0x050505
    });

    const pupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
    pupil.position.z = 1.19;
    eyeGroup.add(pupil);

    // แสงสะท้อนในตา
    const shineGeometry = new THREE.CircleGeometry(0.08, 32);
    const shineMaterial = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.95
    });

    const shine = new THREE.Mesh(shineGeometry, shineMaterial);
    shine.position.set(0.14, 0.12, 1.20);
    eyeGroup.add(shine);

    // เปลือกตาบน
    const upperLidShape = new THREE.Shape();
    upperLidShape.moveTo(-1.75, 0);
    upperLidShape.quadraticCurveTo(0, 1.05, 1.75, 0);
    upperLidShape.lineTo(1.75, 0.95);
    upperLidShape.quadraticCurveTo(0, 1.65, -1.75, 0.95);
    upperLidShape.closePath();

    const upperLidGeometry = new THREE.ShapeGeometry(upperLidShape);
    const lidMaterial = new THREE.MeshStandardMaterial({
      color: 0xd9b0a0,
      roughness: 0.9,
      side: THREE.DoubleSide
    });

    const upperLid = new THREE.Mesh(upperLidGeometry, lidMaterial);
    upperLid.position.z = 1.28;
    upperLid.position.y = 0.15;
    eyeGroup.add(upperLid);

    // เปลือกตาล่าง
    const lowerLidShape = new THREE.Shape();
    lowerLidShape.moveTo(-1.75, 0);
    lowerLidShape.quadraticCurveTo(0, -1.05, 1.75, 0);
    lowerLidShape.lineTo(1.75, -0.95);
    lowerLidShape.quadraticCurveTo(0, -1.65, -1.75, -0.95);
    lowerLidShape.closePath();

    const lowerLidGeometry = new THREE.ShapeGeometry(lowerLidShape);
    const lowerLid = new THREE.Mesh(lowerLidGeometry, lidMaterial);
    lowerLid.position.z = 1.27;
    lowerLid.position.y = -0.15;
    eyeGroup.add(lowerLid);

    // เส้นขอบตา
    const eyeOutlineShape = new THREE.Shape();
    eyeOutlineShape.moveTo(-1.8, 0);
    eyeOutlineShape.quadraticCurveTo(0, 1.0, 1.8, 0);
    eyeOutlineShape.quadraticCurveTo(0, -1.0, -1.8, 0);

    const outlinePoints = eyeOutlineShape.getPoints(100);
    const outlineGeometry = new THREE.BufferGeometry().setFromPoints(outlinePoints);
    const outlineMaterial = new THREE.LineBasicMaterial({ color: 0x111111 });
    const outline = new THREE.LineLoop(outlineGeometry, outlineMaterial);
    outline.position.z = 1.31;
    eyeGroup.add(outline);

    // พื้นหลังจุดแสงเบา ๆ
    const starsGeometry = new THREE.BufferGeometry();
    const starCount = 400;
    const starPositions = [];

    for (let i = 0; i < starCount; i++) {
      starPositions.push(
        (Math.random() - 0.5) * 30,
        (Math.random() - 0.5) * 20,
        (Math.random() - 0.5) * 30
      );
    }

    starsGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(starPositions, 3)
    );

    const starsMaterial = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.03,
      transparent: true,
      opacity: 0.7
    });

    const stars = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(stars);

    // อนิเมชันให้ตามองไปมา
    const irisGroup = new THREE.Group();
    scene.add(irisGroup);

    irisGroup.add(iris);
    irisGroup.add(pupil);
    irisGroup.add(shine);

    function animate() {
      requestAnimationFrame(animate);

      const t = performance.now() * 0.001;

      // ลูกตาขยับเบา ๆ
      irisGroup.position.x = Math.sin(t * 1.2) * 0.12;
      irisGroup.position.y = Math.cos(t * 0.9) * 0.08;

      // ดวงตาหมุนเบา ๆ
      eyeGroup.rotation.y = Math.sin(t * 0.4) * 0.12;
      eyeGroup.rotation.x = Math.cos(t * 0.3) * 0.05;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
