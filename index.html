<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Eyeball</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: radial-gradient(
        circle at center,
        #1a1a1a 0%,
        #050505 70%
      );
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    .title {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
      z-index: 10;
      pointer-events: none;
    }

    .hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.65);
      font-size: 13px;
      z-index: 10;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
</head>

<body>

  <div class="title">👁️ 3D EYEBALL</div>
  <div class="hint">
    ขยับเมาส์ แล้วลูกตาจะมองตาม
  </div>

  <script type="module">

    import * as THREE from "three";


    // =====================================
    // SCENE
    // =====================================

    const scene = new THREE.Scene();

    scene.background =
      new THREE.Color(0x050505);


    // =====================================
    // CAMERA
    // =====================================

    const camera =
      new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
      );

    camera.position.set(
      0,
      0,
      6
    );


    // =====================================
    // RENDERER
    // =====================================

    const renderer =
      new THREE.WebGLRenderer({
        antialias: true
      });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );

    renderer.outputColorSpace =
      THREE.SRGBColorSpace;

    document.body.appendChild(
      renderer.domElement
    );


    // =====================================
    // LIGHT
    // =====================================

    const ambientLight =
      new THREE.AmbientLight(
        0xffffff,
        1.8
      );

    scene.add(
      ambientLight
    );


    const mainLight =
      new THREE.DirectionalLight(
        0xffffff,
        5
      );

    mainLight.position.set(
      5,
      5,
      6
    );

    scene.add(
      mainLight
    );


    const fillLight =
      new THREE.DirectionalLight(
        0x77aaff,
        1.8
      );

    fillLight.position.set(
      -5,
      2,
      4
    );

    scene.add(
      fillLight
    );


    const rimLight =
      new THREE.PointLight(
        0xffffff,
        12,
        25
      );

    rimLight.position.set(
      0,
      0,
      8
    );

    scene.add(
      rimLight
    );


    // =====================================
    // EYE GROUP
    // =====================================

    const eyeGroup =
      new THREE.Group();

    scene.add(
      eyeGroup
    );


    // =====================================
    // EYEBALL
    // =====================================

    const eyeballGeometry =
      new THREE.SphereGeometry(
        1.55,
        128,
        128
      );


    const eyeballMaterial =
      new THREE.MeshPhysicalMaterial({

        color: 0xfafafa,

        roughness: 0.18,

        metalness: 0,

        clearcoat: 1,

        clearcoatRoughness: 0.03

      });


    const eyeball =
      new THREE.Mesh(
        eyeballGeometry,
        eyeballMaterial
      );


    eyeball.scale.y =
      0.92;


    eyeGroup.add(
      eyeball
    );


    // =====================================
    // IRIS GROUP
    // =====================================

    const irisGroup =
      new THREE.Group();

    eyeGroup.add(
      irisGroup
    );


    // =====================================
    // IRIS OUTER
    // =====================================

    const irisOuterGeometry =
      new THREE.CircleGeometry(
        0.58,
        128
      );


    const irisOuterMaterial =
      new THREE.MeshPhysicalMaterial({

        color: 0x1f8fff,

        roughness: 0.35,

        metalness: 0.05,

        clearcoat: 0.8

      });


    const irisOuter =
      new THREE.Mesh(
        irisOuterGeometry,
        irisOuterMaterial
      );


    irisOuter.position.z =
      1.57;


    irisGroup.add(
      irisOuter
    );


    // =====================================
    // IRIS RING
    // =====================================

    const irisRingGeometry =
      new THREE.RingGeometry(
        0.26,
        0.53,
        128
      );


    const irisRingMaterial =
      new THREE.MeshBasicMaterial({

        color: 0x63c0ff,

        transparent: true,

        opacity: 0.45,

        side: THREE.DoubleSide

      });


    const irisRing =
      new THREE.Mesh(
        irisRingGeometry,
        irisRingMaterial
      );


    irisRing.position.z =
      1.575;


    irisGroup.add(
      irisRing
    );


    // =====================================
    // INNER IRIS
    // =====================================

    const irisInnerGeometry =
      new THREE.CircleGeometry(
        0.32,
        128
      );


    const irisInnerMaterial =
      new THREE.MeshBasicMaterial({
        color: 0x0f5ca8
      });


    const irisInner =
      new THREE.Mesh(
        irisInnerGeometry,
        irisInnerMaterial
      );


    irisInner.position.z =
      1.58;


    irisGroup.add(
      irisInner
    );


    // =====================================
    // PUPIL
    // =====================================

    const pupilGeometry =
      new THREE.CircleGeometry(
        0.22,
        128
      );


    const pupilMaterial =
      new THREE.MeshBasicMaterial({
        color: 0x000000
      });


    const pupil =
      new THREE.Mesh(
        pupilGeometry,
        pupilMaterial
      );


    pupil.position.z =
      1.59;


    irisGroup.add(
      pupil
    );


    // =====================================
    // PUPIL CORE
    // =====================================

    const pupilCoreGeometry =
      new THREE.CircleGeometry(
        0.12,
        64
      );


    const pupilCoreMaterial =
      new THREE.MeshBasicMaterial({
        color: 0x000000
      });


    const pupilCore =
      new THREE.Mesh(
        pupilCoreGeometry,
        pupilCoreMaterial
      );


    pupilCore.position.z =
      1.595;


    irisGroup.add(
      pupilCore
    );


    // =====================================
    // LIGHT REFLECTION 1
    // =====================================

    const reflection1Geometry =
      new THREE.CircleGeometry(
        0.11,
        32
      );


    const reflection1Material =
      new THREE.MeshBasicMaterial({

        color: 0xffffff,

        transparent: true,

        opacity: 0.95

      });


    const reflection1 =
      new THREE.Mesh(
        reflection1Geometry,
        reflection1Material
      );


    reflection1.position.set(
      0.18,
      0.18,
      1.605
    );


    irisGroup.add(
      reflection1
    );


    // =====================================
    // LIGHT REFLECTION 2
    // =====================================

    const reflection2Geometry =
      new THREE.CircleGeometry(
        0.045,
        32
      );


    const reflection2Material =
      new THREE.MeshBasicMaterial({

        color: 0xffffff,

        transparent: true,

        opacity: 0.75

      });


    const reflection2 =
      new THREE.Mesh(
        reflection2Geometry,
        reflection2Material
      );


    reflection2.position.set(
      -0.10,
      -0.08,
      1.605
    );


    irisGroup.add(
      reflection2
    );


    // =====================================
    // STARS
    // =====================================

    const starsGeometry =
      new THREE.BufferGeometry();


    const starCount =
      500;


    const starPositions =
      [];


    for (
      let i = 0;
      i < starCount;
      i++
    ) {

      starPositions.push(

        (Math.random() - 0.5) * 30,

        (Math.random() - 0.5) * 20,

        (Math.random() - 0.5) * 30

      );

    }


    starsGeometry.setAttribute(

      "position",

      new THREE.Float32BufferAttribute(
        starPositions,
        3
      )

    );


    const starsMaterial =
      new THREE.PointsMaterial({

        color: 0xffffff,

        size: 0.03,

        transparent: true,

        opacity: 0.6

      });


    const stars =
      new THREE.Points(
        starsGeometry,
        starsMaterial
      );


    scene.add(
      stars
    );


    // =====================================
    // MOUSE
    // =====================================

    let mouseX = 0;

    let mouseY = 0;


    window.addEventListener(
      "mousemove",
      (event) => {

        mouseX =
          (
            event.clientX /
            window.innerWidth
            -
            0.5
          ) * 2;


        mouseY =
          -(
            event.clientY /
            window.innerHeight
            -
            0.5
          ) * 2;

      }
    );


    // =====================================
    // TOUCH
    // =====================================

    window.addEventListener(
      "touchmove",
      (event) => {

        const touch =
          event.touches[0];


        mouseX =
          (
            touch.clientX /
            window.innerWidth
            -
            0.5
          ) * 2;


        mouseY =
          -(
            touch.clientY /
            window.innerHeight
            -
            0.5
          ) * 2;

      },

      {
        passive: true
      }
    );


    // =====================================
    // ANIMATION
    // =====================================

    function animate() {

      requestAnimationFrame(
        animate
      );


      const time =
        performance.now() *
        0.001;


      // =================================
      // LEFT / RIGHT
      // =================================

      eyeGroup.rotation.y +=

        (
          mouseX * 0.38
          -
          eyeGroup.rotation.y
        )

        * 0.06;


      // =================================
      // UP / DOWN
      //
      // ตรงนี้แก้แล้ว
      // ต้องใช้ -mouseY
      // เพราะแกน X ของ Three.js
      // หมุนตรงข้ามกับหน้าจอ
      // =================================

      eyeGroup.rotation.x +=

        (
          -mouseY * 0.24
          -
          eyeGroup.rotation.x
        )

        * 0.06;


      // =================================
      // IRIS FOLLOW MOUSE
      // =================================

      irisGroup.position.x +=

        (
          mouseX * 0.10
          -
          irisGroup.position.x
        )

        * 0.08;


      irisGroup.position.y +=

        (
          mouseY * 0.07
          -
          irisGroup.position.y
        )

        * 0.08;


      // =================================
      // FLOATING
      // =================================

      eyeGroup.position.y =
        Math.sin(
          time * 1.2
        ) * 0.04;


      // =================================
      // STAR MOVEMENT
      // =================================

      stars.rotation.y +=
        0.0008;


      renderer.render(
        scene,
        camera
      );

    }


    animate();


    // =====================================
    // RESIZE
    // =====================================

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
